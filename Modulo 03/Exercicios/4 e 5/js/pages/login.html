<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/main.css">
    <script src="../components/site-header.js" defer></script>
    <script src="../components/site-footer.js" defer></script>
    <script type="module" src="../pages/login.js" defer></script>
    <title>Login</title>
</head>
<body>
    <site-header></site-header>
    <main class="auth">
        <form id="form-cadastro" class="formulario">
            <h1>Login</h1>

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="senha">senha</label>
            <input type="password" id="senha" required>

            <div class="mostrar-senha">
                <label for="mostrar-senha">Mostrar Senha</label>
                <input type="checkbox" id="mostrar-senha">
            </div>

            <p id="aviso" class="aviso"></p>
            <button type="submit" class="btn btn--primary">Entar</button>
            <p class="rodape-form"><a href="esqueceusenha.html">Esqueceu sua senha?</a></p>
            <p class="rodape-form">Não tem conta? <a href="cadastro.html">Cadastrar-se</a></p>
        </form>

    </main>

    <site-footer></site-footer>
</body>
</html>
