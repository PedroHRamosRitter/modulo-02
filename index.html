<!DOCTYPE html> <!-- Informa ao navegador que este documento usa HTML5  -->
<html lang="pt-BR"> <!-- Marca o inicio da pagina HTML. O atributo lang = "pt-BR" indicar que o idioma principal é o portugues -->
<head> <!-- Cabeãlho da pagina. Aqui fica configurações e informações que não aparecem no corpo da pagina -->
    <meta charset="UTF-8"> <!-- Define o padão de caracterres. Permite acentos, ~, emojis, e carecteres especiais -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Faz a página se adaptar a celulares e computadores -->
    <title>Meu Primeiro Site</title> <!-- Título da pagina, aparece na aba do navegador -->
</head> <!-- Fecha a tag HEAD -->
<body>  <!-- Corpo da página. Tudo que aparece para o usuário fica aqui! -->
    <h1>Olá, mundo!</h1>
    <h2>Site para estudo do meu curso de full stack 👍👍 </h2>
    <p>Esta é uma estrutura HTML básica 👍</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>
</body> <!-- Fecha a tag body-->
</html> <!-- Fecha a tag html-->
